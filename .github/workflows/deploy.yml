name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the deploy job may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check the export
        run: test -f out/index.html && test -f out/en/index.html && test -f out/CNAME && test -f out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 1

  # Pull requests only build; production deploys happen on push to main.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Check the downloaded export
        run: test -f out/index.html && test -f out/CNAME && test -f out/.nojekyll
      # Third-party action pinned to a full commit SHA (v4.1.0); bump deliberately.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
